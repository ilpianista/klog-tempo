[project]
name = "klog-tempo"
version = "0.1.0"
description = "Export klog time entries to Tempo Server"
authors = [
    { name = "Andrea Scarpino", email = "andrea@scarpino.dev" }
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
klog-tempo = "klog_tempo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["klog_tempo"]
